# 英字の語に付く和文の語（vs lint の affix-spacing・改善案 #105）
#
# 英字の語とこれらの語の間に半角空白を入れる（「EPUB 用」「A 案」「Newton 法」）。
# 空白なしで書いた箇所（「EPUB用」）を指摘し、vs lint --fix で空白を入れる。
#
# 英字の語と和文の境目に空白を入れるのが本書の方針だが、境目をすべて見ると
# 「自動ID」のように意図して詰めた語まで指摘してしまう。いろいろな英字の語に付く語に
# 絞って、確実に揃えたい箇所だけを見る。原稿で気づいた語を足していく。
#
# 一覧の語の直後（前に付く語は直前）に漢字・カタカナが続くときは、別の語の一部と
# みなして拾わない（「API用語」の「用」、「構図A」の「図」）。

# 英字の語の後ろに付く語（EPUB 用・CMYK 版・PDF 内・Newton 法）
suffixes:
  - 用
  - 版
  - 内
  - 外
  - 側
  - 製
  - 系
  - 型
  - 式
  - 法
  - 案
  - 方式
  - 形式
  - 方法
  - 画像
  - 変換
  - 自体
  - タグ
  - ページ
  - ファイル
  - 記法
  - 表記
  - 対応
  - 互換
  - 以外
  - 以上
  - 以下
  - 未満
  - 全体
  - 単位
  - 環境
  - 向け
  - 経由
  - 番号

# 英字の語の前に付く語（付録 A・案 B）
prefixes:
  - 付録
  - 図
  - 表
  - リスト
  - 例
  - 案
  - 方式
