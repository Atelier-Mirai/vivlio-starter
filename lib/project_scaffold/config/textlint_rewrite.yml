# =============================================================
#  📝 この本の表記 - prh 辞書
# -------------------------------------------------------------
#  • 「この本ではこう書く」と決めた表記を並べます
#  • .textlintrc.yml の prh.rulePaths で読み込まれる
#  • expected: 修正後の表記, patterns: 修正対象の表記リスト
#
#  製品名・技術用語・誤字・外来語の長音など、どの本にも当てはまるものは
#  config/textlint_dictionaries/ の同梱辞書が受け持ちます。ここには書かないでください。
# =============================================================

version: 1
rules:
  # ----------------------------------------------
  # ルール1: 長音の付け方（例: ユーザ vs ユーザー）
  # ----------------------------------------------
  - expected: ユーザー
    patterns:
      # 長音が続くものは除く。素の「ユーザ」だと「ユーザーさん」の頭にも当たり、
      # 敬称の指摘が「ユーザ => ユーザー」という的外れな見出しに変わってしまう
      - /ユーザ(?!ー)/
      - 'ユーザーさん' # ユーザーの後に続く不要な敬称を修正したい場合

  # ハンドラは長音を付けない（prh_cho_on.yml の「語尾が -er なら長音」の例外）
  - expected: ハンドラ
    patterns:
      - 'ハンドラー'
  
  # ----------------------------------------------
  # ルール2: 英字と漢字の間に半角スペースを空ける
  # ----------------------------------------------
  - expected: CSS 組版
    patterns:
      - 'CSS組版'
      - 'CSS組み版'
      - 'CSS 組み版'

  # 製品名・技術用語・誤字は、同梱の辞書（config/textlint_dictionaries/）が受け持ちます。
  # このファイルに書くのは「この本ではこう書く」と決めた表記だけです

  # OCR の誤認識は config/ocr_corrections.yml が受け持ちます。
  # 読み取った直後に直すので、著者が自分で書いた原稿は巻き添えになりません
  # （ここに置いていた頃は、アルミニウムの `Al` が `AI` に書き換えられていました）

  # --- 数と記号の表記 ---
  - expected: 一度
    patterns:
      - 1度
  - expected: 第一部
    patterns:
      - /第1部/
  - expected: 第二部
    patterns:
      - /第2部/
  - expected: 第一引数
    patterns: 第1引数
  - expected: 第二引数
    patterns: 第2引数
  - expected: 第三引数
    patterns: 第3引数
  - expected: 第四引数
    patterns: 第4引数
  - expected: 第五引数
    patterns: 第5引数
  # 数え方の「通り」は漢数字で書く（一つ・二つ と同じ扱い）。副詞の「ひととおり」も
  # 漢字に揃える——二通り・三通りと並べたとき、一だけ姿が変わるのを避けるため
  - expected: 一通り
    patterns:
      - /ひと(通り|とおり)/
      - /1\s*通り/
  - expected: 二通り
    patterns: /2\s*通り/
  - expected: 三通り
    patterns: /3\s*通り/
  # 中身が半角英数字だけのかっこは対象外にします（先読みで外しています）。
  # 手順番号の (1) (a)、英字の補足 (Matz)、カンマ区切りの座標 (0, 0) が該当します。
  # 全角にすると左に空きができ、行頭では字下げに見えます。座標は数学の書き方でもあります
  - expected: （$1）
    pattern:  '/\((?![0-9A-Za-z]+(?:, ?[0-9A-Za-z]+)*\))(.+?)\)/'
    specs:
      - from: そうですね(笑)
        to:   そうですね（笑）
      - from: (@<fn>{test})
        to:   （@<fn>{test}）
      - from: "(ほげ)ほげ)"
        to:   "（ほげ）ほげ)"
      - from: 中心は (0, 0) です
        to:   中心は (0, 0) です
      - from: 手順 (1) から始めます
        to:   手順 (1) から始めます
      - from: まつもとゆきひろ (Matz) 氏
        to:   まつもとゆきひろ (Matz) 氏
      - from: 発売は(2026年)です
        to:   発売は（2026年）です
    prh: 半角カッコの代わりに全角カッコを使うこと。文字のバランスが崩れるためです
  - expected: →
    pattern: /->/
