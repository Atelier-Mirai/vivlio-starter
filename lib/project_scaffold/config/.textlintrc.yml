# =============================================================
#  ✨ Vivlio Starter 推奨 Textlint 設定ガイド ✨
# -------------------------------------------------------------
#  • 既定では contents/**/*.md を対象とします（CLI 側で解決）
#  • config/textlint_dictionaries/ 配下に配置した prh 辞書を読み込みます
#  • 必要に応じてプロジェクト固有のルールを調整してください
# =============================================================

plugins: []

filters:
  # 校正の対象から外す要素
  node-types:
    nodeTypes:
      - Code
      - CodeBlock
      - Link
      - Image

  # <!-- vs-lint-disable --> と <!-- vs-lint-enable --> で囲んだ範囲を校正の対象から外す
  # （この設定を消すと、囲みが効かなくなります）
  comments: true

  # 指摘したくない語句の一覧（VFM 記法・書名・資格名称など）
  allowlist:
    allowlistConfigPaths:
      - ./textlint_allowlist.yml

rules:
  # 技術文書のスタイルをチェックする標準プリセット
  preset-ja-technical-writing:
    # 「である」調と「です・ます」調の混在。3 つとも空にすると、本文・見出し・箇条書きの
    # それぞれで多数派を自動判定します（"ですます" / "である" と書けば決め打ちになります）
    no-mix-dearu-desumasu:
      preferInBody: ""
      preferInHeader: ""
      preferInList: ""

    # 一文に同じ助詞が 2 回以上。並列（A も B も）や役割の違う助詞まで指摘するため切っています
    no-doubled-joshi: false

    # 同じ語の連続。記号の重なり（★★☆☆☆・……）まで指摘するため切っています
    ja-no-successive-word: false

    # 「することができる」の冗長さ。「することも」「することは」は意味を運ぶので許容します
    ja-no-redundant-expression:
      dictOptions:
        dict1:              # 〜することが可能
          allows:
            - "/^することも/"
        dict2:              # 〜することができる
          allows:
            - "/^することも/"
            - "/^することは/"

    # 一文に打てる読点「、」の上限
    max-ten:
      max: 3

    # 一文に打てる半角カンマ「,」の上限（和文の読点は上の max-ten が見ます）
    max-comma:
      max: 3

    # 連続して書ける漢字の上限（書籍名・専門用語に合わせて緩めています）
    max-kanji-continuous-len:
      max: 10

    # ！と？の使用を許可する
    no-exclamation-question-mark:
      allowFullWidthExclamation: true  # 全角の！
      allowFullWidthQuestion: true     # 全角の？
      allowHalfWidthExclamation: true  # 半角の !
      allowHalfWidthQuestion: true     # 半角の ?

    # 一文の長さ（sentence-length）と文末の句点（ja-no-mixed-period）は vs lint の独自ルールが
    # 受け持つため、ここに書いても効きません。上限は book.yml の lint.sentence_length_max です

  # 表記揺れの辞書。使う辞書はここに並べ、要らない辞書は行ごと消してください
  # prh_*.yml は「ics.media」「テキスト校正くん」の校正辞書（作成者: 池田 泰延）で、
  # 一部の項目は「JavaScript Primer」（https://jsprimer.net）の校正辞書に由来します
  prh:
    rulePaths:
      - ./textlint_dictionaries/prh_idiom.yml          # 誤字
      - ./textlint_dictionaries/prh_open_close.yml     # ひらく漢字・閉じる漢字
      - ./textlint_dictionaries/prh_redundancy.yml     # 冗長な言い回し
      - ./textlint_dictionaries/prh_duplicate.yml      # 重言
      - ./textlint_dictionaries/prh_cho_on.yml         # 外来語のカタカナ表記
      - ./textlint_dictionaries/prh_corporation.yml    # 固有名詞
      - ./textlint_dictionaries/prh_web_technology.yml # 技術用語
      - ./textlint_rewrite.yml                         # この本の表記（自由に書き足せます）

  # preset-japanese は読み込みません。11 ルールが上のプリセットと重複し、同じ名前で
  # 二重に動くためです（康煕部首の検出は vs lint の独自ルール kanji-lookalike が受け持ちます）

  # 和文と欧文の間のスペース
  preset-ja-spacing: true

  # 技術用語のスペルチェック
  spellcheck-tech-word: true
