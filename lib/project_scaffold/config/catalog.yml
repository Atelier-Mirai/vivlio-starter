# 【基本形】
# 本文が1章だけの例です。この構成にする場合は、現在の設定を次の例に置き換えます。
# 例の行を選び、行頭の「# 」を外してください。説明の行はコメントのまま残します。
# VS Code では、行を選んで Cmd+/（macOS）または Ctrl+/（Windows・Linux）で切り替えられます。
# 前書き・付録・後書きが不要な場合は、それぞれ PREFACE:・APPENDICES:・POSTFACE: の下に原稿を書かず、空にします。
#
# PREFACE:
#
# CHAPTERS:
#   - 01-install
#
# APPENDICES:
#
# POSTFACE:
#
# 【部構成を使う】
# 本文を「第一部」「第二部」や「初級編」「中級編」などに分ける場合は、
# CHAPTERS: の下に「- 部の名称:」を書き、その部に含める原稿をさらに字下げして並べます。
# 部の名称の末尾には、半角の「:」を付けてください。字下げは次の例に合わせてください。
#
# CHAPTERS:
#   - 初級編:
#       - 01-install
#       - 02-tutorial
#   - 中級編:
#       - 03-syntax
#       - 04-customize
#   - 上級編:
#       - 05-faq
#       - 06-bestpractice
#
# 【分冊にする】
# 上下巻などに分ける場合は、現在の設定を次の VOLUMES: から始まる構成に置き換えます。
# VOLUMES: の下に巻を並べ、PREFACE:・CHAPTERS:・APPENDICES:・POSTFACE: は各巻の中に書きます。
# 本全体の前書き・後書きは、VOLUMES: と並べて一番上の PREFACE:・POSTFACE: に書けます。
# name には「上巻」などの呼び名を書きます。
# id には、出力ファイル名や vs build --volume で巻を指定するための名前を書きます。
# id に使える文字は、半角の英小文字・数字・アンダースコア（_）です。
# 章番号は前の巻から続きます。上巻が第12章で終わる場合、下巻は第13章から始まります。
# 同じ付録を複数の巻に含める場合、その付録の記号（A・B など）はどの巻でも同じになります。
# 2巻目以降にも前書きを付ける場合は、未使用の番号で原稿を作り、その巻の PREFACE: に書いてください。
#
# VOLUMES:
#   - name: 上巻
#     id: upper
#     main_title: 本のタイトル　上巻   # 省略すると book.yml の main_title を使います。
#     cover: upper                  # covers/ 内の frontcover_upper.png と backcover_upper.png を表紙に使います。
#     PREFACE:
#       - 00-preface
#     CHAPTERS:
#       - 01-install
#       - 02-tutorial
#     APPENDICES:
#       - 90-cheatsheet
#
#   - name: 下巻
#     id: lower
#     main_title: 本のタイトル　下巻
#     cover: lower
#     release: "令和九年一月十日"       # 発行日や ISBN は巻ごとに指定できます。
#     isbn: "978-4-…"
#     PREFACE:
#       - 20-lower-intro      # 下巻の前書きの原稿を指定します。
#     CHAPTERS:
#       - 21-syntax
#     APPENDICES:
#       - 90-cheatsheet       # 上巻と同じ付録を指定しています。
#     POSTFACE:
#       - 99-postface
#
# 巻を指定してビルドするには、vs build --volume lower のように id を指定します。
# vs build --volume all を実行すると、各巻を順番にビルドします。
# 巻を指定せずに vs build を実行すると、全巻を一冊にまとめた合本を作ります。
# 表紙を作る vs cover でも、--volume で巻を指定できます。
#
# 巻ごとにタイトルや発行日などを変える場合は、各巻の中に設定を書きます。
# book.yml の book: の下にある設定（main_title・subtitle・author・release・isbn・cover など）を、
# 同じ名前で指定してください。指定した巻だけに適用され、省略した設定には book.yml の値を使います。
#
# 【巻ごとの章番号・付録記号・全巻目次を設定する】
# chapter_start には、その巻の最初の章番号を書きます。省略すると、前の巻から続けて番号を付けます。
# appendix_start には、その巻の付録の開始記号を英字1文字で書きます。
# 省略すると、全巻を通した付録の並びに従って記号を付けます。
# whole_toc: true を指定すると、その巻の目次の前に、全巻の構成を示す「全巻目次」を載せます。
# 全巻目次には章を載せ、book.yml の page.toc_depth が 2 以上の場合は節も載せます。
# 次の例では、下巻の章番号と付録記号をそれぞれ 1 と A から始め、全巻目次も載せます。
#
# VOLUMES:
#   - name: 上巻
#     id: upper
#     CHAPTERS:
#       - 01-install          # 第1章になります。
#       - 02-tutorial         # 第2章になります。
#     APPENDICES:
#       - 90-cheatsheet       # 付録 A になります。
#       - 91-glossary         # 付録 B になります。
#   - name: 下巻
#     id: lower
#     chapter_start: 1        # 下巻も第1章から始めます。省略すると第3章から始まります。
#     appendix_start: A       # 下巻の付録を A から始めます。省略すると 92-links は付録 C になります。
#     whole_toc: true         # 下巻の目次の前に全巻目次を載せます。
#     CHAPTERS:
#       - 21-syntax           # 第1章になります。
#       - 22-customize        # 第2章になります。
#     APPENDICES:
#       - 92-links            # 付録 A になります。
