# ========================================
# 会話文（対話）記法 :::{.talk} の設定
# ========================================
# 本文で会話文を書くための「表示設定」と「話者定義」をまとめたファイルです。
# このファイルは「任意」です。会話文を使わないなら、まるごと削除しても構いません。
#
# 本文での書き方（詳しくは 22 章「拡張記法」を参照）:
#
#   :::{.talk}
#   haruka: Vivliostyle は CSS で組版するエンジンです。
#   mirai: CSS だけで本が作れるんですか？
#   haruka: そうです。このガイドブック自体が実例ですよ。
#          （行頭を字下げすると、直前の発話の続きになります）
#   :::
#
# 行頭の「キー: 発話」でキーを切り替えます。キーは半角英数（ローマ字）で書きます。

# ----------------------------------------
# 表示設定（本文の :::{.talk ...} 指定が優先されます）
# ----------------------------------------
# display は予約キーです。話者のキーには使えません。
#
#   style      chat   … チャット風の吹き出し（左右に振り分け・アバターの下に名前）
#              inline … 「名前：発話」を 1 段落で組む
#   name       話者名を表示するか（true / on / yes / 1 が真）
#   avatar     on   … avatar: に画像を指定した話者だけ表示
#              auto … 画像があればそれ、無ければ簡易アバターを自動生成
#              off  … 表示しない
#   separator  inline のとき、名前と発話のあいだに置く区切り
#
# Kindle では表示が次のように自動で劣化します（KFX の制約のため）:
#   style  → inline 相当へ組み替え     avatar → 非表示
#   name   → 常に表示（話者が分からなくなるため）
#   separator / 話者の name・color はそのまま有効、side は無視されます。

# display:
#   style: chat
#   name: true
#   avatar: on
#   separator: "："

# ----------------------------------------
# 話者定義
# ----------------------------------------
# 詳細形（値がマップ）。省略した項目は既定値になります。
#
#   name    表示名（省略時はキーをそのまま表示）
#   color   テーマ色名 / HEX（省略時はテーマのアクセント色）
#   avatar  images/characters/ 内のファイル名（省略時はアバターなし）
#           auto と書くと、話者色に名前の頭 1 文字を白抜きした簡易アバターを
#           システムが自動生成します（画像を用意しなくても始められます）
#   side    left / right（省略時は出現順に left, right… と自動割当）
#
# 色だけを決めたいときは簡易形も使えます（表示名はキーのまま）:
#
#   mirai: blue
#
# 色として指定できるのは theme.color と同じ語彙です:
#   yellow / orange / red / magenta / purple / indigo /
#   navy / blue / cyan / teal / green / lime、または '#4f46e5' のような HEX。
#
# アバター画像は images/characters/ に置きます（.webp / .png / .jpg）。
#
# 下の 2 人は記入例です。名前・色・アバターを書き換えて、
# あなたのキャラクターとしてお使いください。
# ----------------------------------------

haruka:
  name: 遙香
  color: purple
  avatar: haruka.webp
  side: left

mirai:
  name: 未來
  color: blue
  avatar: mirai.webp
  side: right
