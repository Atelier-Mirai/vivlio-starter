# Ruby 3.4 と 4.0 の両方で `rake test` を走らせる。
#
# 両方を回すのが要点である。`it`（暗黙ブロック引数）は Ruby 3.3 以下でも
# 構文エラーにならず「it というメソッドの呼び出し」として通り、実行時に
# NameError になる——静的解析では捕まらない類の非互換なので、
# 対応を謳うバージョンで実際に走らせる以外に確かめる方法がない。
#
# ここで走るのは MIT の StandardProvider 経路である。AGPL の
# vivlio-starter-pdf は Gemfile に含めていないため CI には入らない
# （開発機ではプラグインが入っていて EnhancedProvider 経路になるので、
# CI は「プラグイン無しでも壊れていないか」を見る役割を兼ねる）。
#
# 版面の実ビルドを伴う test:layout / test:targets は含めない。
# Vivliostyle（Node）と Chrome の取得に時間がかかり、CI の役割に見合わない。
name: test

# ------------------------------------------------------------------
# 自動起動を止めている（2026-08-21）。
#
# 導入（2026-08-06）以来、実行はすべて 4 秒で失敗していた——
#   The job was not started because your account is locked due to a billing issue.
# コードではなく GitHub アカウント側の状態なので、ここを直しても動かない。
#
# **止めたのは「無いより悪い」から。** push のたびに赤い × が並ぶと、
# 本当に壊れたときに気づけなくなる。ローカルの `rake test:release` は
# CI（Ruby 2 版で `rake test`）より広く、実ビルド・epubcheck・
# パッケージングまで通すので、当面の回帰検出はそちらが担う。
#
# **課金が解決したら、下の workflow_dispatch を push / pull_request へ
# 戻すだけでよい。** ジョブの中身は妥当なので触っていない。
# ------------------------------------------------------------------
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']

    steps:
      - uses: actions/checkout@v4

      # 外部ツールが無いテストは自前で skip するため、これらは「skip を減らす」ための任意導入。
      # 入らなくてもテストは通る（落とさないよう || true は付けない——入らないなら原因を見たい）。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            imagemagick libvips mecab libmecab-dev mecab-ipadic-utf8

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rake test
