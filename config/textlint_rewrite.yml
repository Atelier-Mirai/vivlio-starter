# =============================================================
#  📝 prh 表記ゆれ辞書 - Vivlio Starter
# -------------------------------------------------------------
#  • textlint-rule-prh で使用する表記揺れ修正ルールを定義
#  • .textlintrc.yml の prh.rulePaths で読み込まれる
#  • expected: 修正後の表記, patterns: 修正対象の表記リスト
# =============================================================

version: 1
rules:
  # ----------------------------------------------
  # ルール1: 正式名称（Vivlio Starter）の統一
  # ----------------------------------------------
  - expected: Vivlio Starter
    # 大文字・小文字やスペースが意図せず崩れた表記を修正対象とする
    patterns:
      - 'vivlio starter'  # 小文字とスペース
      - 'VivlioStarter'   # スペースなし（キャメルケースのような形式）
      - 'vivliostarter'   # 完全な小文字・スペースなし
      - 'VIVLIO STARTER'  # 全て大文字
      - 'vivlio_starter'  # アンダースコア

  # ----------------------------------------------
  # ルール2: コマンド名（vivlio-starter）は地の文に置かない
  # ----------------------------------------------
  # コマンド名・gem 名は `vivlio-starter` とインラインコードで書く（コードは検査対象外）。
  # 地の文の綴りだけをブランド名へ直す。別 gem の vivlio-starter-pdf は対象外
  - expected: Vivlio Starter
    patterns:
      - /vivlio-starter(?!-)/

  # ----------------------------------------------
  # ルール3: よくある一般的な表記ゆれ（例: ユーザ vs ユーザー）
  # ----------------------------------------------
  - expected: ユーザー
    patterns:
      # 長音が続くものは除く。素の「ユーザ」だと「ユーザーさん」の頭にも当たり、
      # 敬称の指摘が「ユーザ => ユーザー」という的外れな見出しに変わってしまう
      - /ユーザ(?!ー)/
      - 'ユーザーさん' # ユーザーの後に続く不要な敬称を修正したい場合

  # ハンドラは長音を付けない（prh_cho_on.yml の「語尾が -er なら長音」の例外）
  - expected: ハンドラ
    patterns:
      - 'ハンドラー'
  
  # ----------------------------------------------
  # ルール4: 技術用語の表記ゆれ（例: javascript vs JavaScript）
  # ----------------------------------------------
  - expected: JavaScript
    patterns:
      - 'javascript'
      - 'Javascript'

  # 英字と漢字の間に半角スペースを空ける、本書の表記に揃える
  - expected: CSS 組版
    patterns:
      - 'CSS組版'
      - 'CSS組み版'
      - 'CSS 組み版'
  
  # ----------------------------------------------
  # ルール5: 誤字・脱字の修正（「〜したいと想います」の修正など）
  # ----------------------------------------------
  - expected: 思います
    patterns:
      - '想います'
  
  # ----------------------------------------------
  # ルール6: 全角/半角スペースの統一（特定の単語の直後の統一）
  # ----------------------------------------------
  - expected: 'GitHub Actions'
    patterns:
      - 'GitHubActions'

  # ==============================================================
  # OCR 固有の誤認識修正ルール
  # ==============================================================

  # OCR が AI を Al (エル) と誤読する
  - expected: AI
    patterns:
      - /\bAl\b/
      - /\bAl(?=[\s（(（])/

  # OCR が「人工」を「入工」と誤読する
  - expected: 人工知能
    patterns:
      - '入工知能'

  # OCR が先頭の「プ」を欠落させる
  - expected: プログラミング
    patterns:
      - /(?<![ァ-ヶー])ログラミング/

  # OCR が「ウェブ」を「ウェプ」と誤読する
  - expected: ウェブ
    patterns:
      - 'ウェプ'

  # OCR が「テキスト」を「テチキスト」と誤読する
  - expected: テキスト
    patterns:
      - 'テチキスト'

  # OCR が「語彙」を「語芸」と誤読する
  - expected: 語彙
    patterns:
      - '語芸'

  # --- 数と記号の表記 ---
  - expected: 一度
    patterns:
      - 1度
  - expected: 第一部
    patterns:
      - /第1部/
  - expected: 第二部
    patterns:
      - /第2部/
  - expected: 第一引数
    patterns: 第1引数
  - expected: 第二引数
    patterns: 第2引数
  - expected: 第三引数
    patterns: 第3引数
  - expected: 第四引数
    patterns: 第4引数
  - expected: 第五引数
    patterns: 第5引数
  # 数え方の「通り」は漢数字で書く（一つ・二つ と同じ扱い）。副詞の「ひととおり」も
  # 漢字に揃える——二通り・三通りと並べたとき、一だけ姿が変わるのを避けるため
  - expected: 一通り
    patterns:
      - /ひと(通り|とおり)/
      - /1\s*通り/
  - expected: 二通り
    patterns: /2\s*通り/
  - expected: 三通り
    patterns: /3\s*通り/
  - expected: （$1）
    pattern:  /\((.+?)\)/
    specs:
      - from: そうですね(笑)
        to:   そうですね（笑）
      - from: (@<fn>{test})
        to:   （@<fn>{test}）
      - from: "(ほげ)ほげ)"
        to:   "（ほげ）ほげ)"
    prh: 半角カッコの代わりに全角カッコを使うこと。文字のバランスが崩れるためです
  - expected: →
    pattern: /->/
