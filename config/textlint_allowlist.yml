# =============================================================
#  📝 Textlint 除外リスト - Vivlio Starter
# -------------------------------------------------------------
#  ここに書いた語は textlint の検査対象から外れます。
#  「この語はこのままでよい」と決めたものを並べてください。
#  正規表現も使えます（下の「言い換えの提案を止めたい語」に例があります）。
#
#  ※ 今の設定では指摘されない語も、書き方の見本として残してあります。
#     漢字の連続は 11 文字以上で指摘されます（config/.textlintrc.yml の
#     max-kanji-continuous-len）。
# =============================================================

# ------- 書籍名（漢字の連続チェックを外す） -------
- "現代計算機科学"
- "プログラミング言語理論"
- "計算機科学入門"

# ------- 資格名称（同上） -------
# 長い資格名はここへ。「第一級総合無線通信士」「第一級陸上無線技術士」のような名称も同じように書けます
- "情報処理安全確保支援士" # 漢字 11 文字。現在の上限でも指摘されるため必須
- "基本情報技術者"
- "応用情報技術者"
- "エンベデッドスペシャリスト"
- "データベーススペシャリスト"
- "ネットワークスペシャリスト"

# ------- 言い換えの提案を止めたい語 -------
# 「A => B」と直すよう促されるが、この本ではそのまま使うと決めた語を書きます
- "以下の" # 「以下の => 次の」を止める
- "以下に" # 「以下に => 次に」を止める
- "下記の" # 「下記の => 次の」を止める
- "/(プロジェクト|プロダクト)マネージャ/" # 正規表現の例。末尾長音（=> マネージャー）を止める

# ------- 誤検出を抑えたい語 -------
# 語の一部が別の語に見えてしまい、意図しない指摘が出る場合に書きます
- "対処方法" # 「対処方 => 対処法」の部分一致による誤検出を止める
- "/通り(ます|ません|ました|抜け|過ぎ)/" # 動詞「通る」。「次のとおり」への指摘は残す
- "既定" # 「既定 => デフォルト」を止める。この本は和語の「既定」で通す
- "括弧" # 「括弧 => カッコ」を止める。この本は漢字の「括弧」で通す

# ------- ここから下に追記してください -------
