# =============================================================
#  ✨ Vivlio Starter 推奨 Textlint 設定ガイド ✨
# -------------------------------------------------------------
#  • 既定では contents/**/*.md を対象とします（CLI 側で解決）
#  • config/textlint_dictionaries/ 配下に配置した prh 辞書を読み込みます
#  • 必要に応じてプロジェクト固有のルールを調整してください
# =============================================================

plugins: []

filters:
  # コードブロックやインラインコードなどを校正対象から除外するための設定。
  node-types:
    nodeTypes:
      - Code
      - CodeBlock
      - Link
      - Image

  # HTMLコメントによる除外（<!-- textlint-disable -->と<!-- textlint-enable -->で囲んだ部分を除外）
  comments: true

  # 除外語句リスト（外部ファイルで管理）
  allowlist:
    allowlistConfigPaths:
      - ./textlint_allowlist.yml  # VFM記法、書籍名、資格名称などを定義

rules:
  # 技術文書のスタイルをチェックする標準プリセット
  preset-ja-technical-writing:
    tech-word: true
    prefer-ja-no-space-around-paren: true  # かっこの周りのスペースを禁止
    # 文体の混在（だ・である調とです・ます調）を、本文・見出し・箇条書きごとに多数派と比べて指摘する。
    # プリセットの既定は「本文はです・ます、箇条書きはである」の決め打ちなので、3 つとも空（自動判定）にする
    no-mix-dearu-desumasu:
      preferInBody: ""
      preferInHeader: ""
      preferInList: ""
    no-doubled-joshi: false  # 並列（AもBも）や役割の違う助詞まで指摘し、本書で 8 割が不要な指摘だったため
    # 一文の長さ（sentence-length）と文末の句点（ja-no-mixed-period）は、vs lint の
    # 独自ルールが同じ名前で受け持つため、ここに書いても効きません（常に無効化されます）。
    # 上限は book.yml の lint.sentence_length_max で変えられます
    ja-no-successive-word: false  # 記号の重なり（★★☆☆☆・……・○○）まで指摘し、本書で 21 件中 20 件が誤検出だったため
    max-kanji-continuous-len:
      max: 10  # 漢字の連続を10文字まで許可（書籍名・専門用語対応）
    no-exclamation-question-mark:
      allowFullWidthExclamation: true  # 全角の！を許可
      allowFullWidthQuestion: true     # 全角の？を許可
      allowHalfWidthExclamation: true  # 半角の!を許可
      allowHalfWidthQuestion: true     # 半角の?を許可

  # 固有名詞や特定の用語の表記揺れをチェック（辞書ファイルの指定）
  # ※ 辞書ファイルは `config/textlint_dictionaries/` 配下に配置
  # 使う辞書はここに全部並べます。要らない辞書は行ごと消してください
  # prh_*.yml は「ics.media」「テキスト校正くん」の校正辞書（作成者: 池田 泰延）
  prh:
    rulePaths:
      - ./textlint_dictionaries/prh_idiom.yml          # 誤字
      - ./textlint_dictionaries/prh_open_close.yml     # ひらく漢字・閉じる漢字
      - ./textlint_dictionaries/prh_redundancy.yml     # 冗長な言い回し
      - ./textlint_dictionaries/prh_duplicate.yml      # 重言
      - ./textlint_dictionaries/prh_cho_on.yml         # 外来語のカタカナ表記
      - ./textlint_dictionaries/prh_corporation.yml    # 固有名詞
      - ./textlint_dictionaries/prh_web_technology.yml # 技術用語
      - ./textlint_rewrite.yml                         # この本の表記（自由に書き足せます）

  # preset-japanese は読まない。12 ルールのうち 11 は preset-ja-technical-writing と同じもので、
  # 残る康煕部首の検出は vs lint の独自ルール（kanji-lookalike）が受け持つ

  # 和文・欧文のスペース統一（技術書での可読性向上）
  preset-ja-spacing:
    jaSpacing: true
    spaceAroundCode: true

  # 技術用語のスペルチェック（誤記防止）
  spellcheck-tech-word: true
