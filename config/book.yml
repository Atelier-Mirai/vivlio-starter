# =============================================================
#  📚 Vivlio Starter 書籍プロジェクト設定ガイド 📚
# -------------------------------------------------------------
#  このファイルは Vivlio Starter のブック全体の設定を管理します。
#
#  ── 著者が設定するセクション ───────────────
#  • book         : 書籍情報（タイトル、著者、出版社など）
#  • project      : プロジェクト情報（出力ファイル名、バージョン）
#  • theme        : テーマ（アクセントカラー、扉絵、装飾スタイル）
#  • page         : ページ設定（版面レイアウト・用紙サイズ）
#  • typography   : タイポグラフィ設定（書体）
#  • output       : 出力設定（PDF、印刷用PDF、EPUB、表紙）
#  • verify       : 原稿の検証（画像パス、裸URL、外部URL）
#  • legal        : リーガル情報（免責、商標）
#  ── 機能ごとの詳細設定 ──────────────────
#  • index_glossary : 索引・用語集の共通設定
#  • index          : 索引の詳細設定
#  • glossary       : 用語集の詳細設定
#  • metrics        : 文章品質メトリクスの基準値
#  • lint           : 文章校正（textlint）の既定設定
#  • spellcheck     : スペルチェックの設定
#  • pdf_read       : PDF 読み取りコマンドの設定
# =============================================================

# ======= 書籍情報 =======
book:
  # ------- 書籍名 -------
  main_title: "はじめての技術書づくり"
  subtitle: "Vivlio Starter 実践ガイド"
  subtitle_style: wave # 副題の装飾（wave | bar | none）から選択

  # ------- 付帯情報（任意） -------
  series: "「技術書典20 新刊」" # 連載名
  release: "令和八年四月二十六日" # 発行日
  publisher: "アトリヱ未來" # 発行者・サークル名（例: アトリヱ未來）。本を世に出す主体。印刷所とは別
  contact: "contact@atelier-mirai.net" # 連絡先
  author: "早乙女 遙香" # 著者名（本名・ペンネーム）
  language: "ja" # 言語
  isbn: "" # 任意（独自ISBN取得の場合、EPUB の識別子 urn:isbn に使用。Kindle は ASIN 自動割り当て）

# ======= プロジェクト情報 =======
project:
  name: "vivlio_starter" # 出力ファイル名のベース
  version: "1.0.0" # 書籍のバージョン（デフォルト: 0.1.0）

# ======= テーマ =======
theme:
  # ------- テーマカラー -------
  color:  green # yellow / orange / red / magenta
                # purple / indigo / navy / blue
                # cyan / teal / green / lime から選択
                # '#ff0000' のような HEX 記法も指定可

  preface_color: teal # 前書き/後書き専用カラー 未指定ならcolorと同色
  appendix_color: cyan # 付録専用カラー 未指定ならcolorと同色

  style: image # image: 画像あり / simple: 画像なし
               # image にすると下の扉絵・節絵が有効になります。（付録は常に simple）

  # ------- 章扉の背景画像 -------
  frontispiece:
    image: sakura   # suisen / ume / nanohana / sakura
                    # suzuran / ajisai / asagao / himawari
                    # kikyo / kosumosu / kiku / tsubaki から選択
                    # images/内の独自画像も指定可
    edge_inset:      5mm # 扉絵を紙の端から内側へ引っ込める量
    heading_offset: 15mm # 章扉の見出しブロック（章番号〜リード）を下げる量
    heading_chars:  10   # 章題を 1 行に何文字入れるか（全角換算）
    lead_chars:     24   # 章リード文を 1 行に何文字入れるか（全角換算）

  # ------- 節見出しの背景画像 -------
  ornament:
    image: sakura
    heading_chars: 14 # 節題を 1 行に何文字入れるか（全角換算・少なくすると字が大きくなる）

  # ------- 見出し記号 -------
  markers:
    h3: "♣" # ♣ 目見出しの記号。h3見出しの前に表示される。一文字推奨。
    h4: "♦" # ♦ 号見出しの記号。h4見出しの前に表示される。一文字推奨。

# ======= ページ設定（版面レイアウト） =======
page:
  # ------- 判型プリセットを選ぶ（page_presets.yml から） -------
  # 紙サイズ・余白・文字サイズ・行送りなど版面の物理的構造を一括で決めます
  # use: a5_standard  # 標準
  # use: a5_airy      # 広め
  # use: a5_compact   # 狭め
  # use: a5_custom    # 著者独自

  use: a4_custom
  # use: b5_compact
  # use: b5_airy
  # use: b5_custom

  # use: a4_standard
  # use: a4_airy
  # use: a4_compact
  # use: a4_custom

  section_pagebreak: false # 節（## 見出し）をページの先頭から始めるか
                          # true  … 節ごとにページを改める（既定）
                          # false … 節を本文の流れの中に続けて組む
                          #         （ページ数を抑えたい本・配布資料向け）

  chapter_pagebreak: any # 章・目次・部扉・付録・用語集・後書き・索引を、どちら側の面から始めるか
                           # recto … 右ページ（奇数）から。いわゆる改丁
                           #         必要なら白紙が 1 枚入る（既定）
                           # any   … どちらでもよい。白紙が入らずページ数が減る
                           # verso … 左ページ（偶数）から
                           # 原稿中の @pagebreak:recto / :verso は、この設定より優先されます

# ======= タイポグラフィ設定（書体・色・装飾） =======
typography:
  # ------- 標準添付書体（page-settings.css の @font-face で定義） -------
  # - 明朝体:     Zen Old Mincho
  # - ゴシック体: Zen Kaku Gothic New
  # - 丸ゴシック体: Zen Maru Gothic
  # - プログラミング用フォント: HackGen35 Console NF
  # ※ 上記以外のフォント名を指定すると Google Fonts から自動取得を試みます。

  # ------- 本文 -------
  body:
    font: Zen Old Mincho

  # ------- 見出し -------
  heading:
    font: Zen Kaku Gothic New

  # ------- コラム -------
  column:
    font: Zen Maru Gothic
    font_size: 8pt # 本文より小さいため独立設定

  # ------- コード -------
  code:
    font: HackGen35 Console NF

  # ------- ノンブル（ページ番号） -------
  folio:
    font: Zen Kaku Gothic New
    placement: sides # center / sides

# ======= 出力設定 =======
output:
  # ------- 出力フォーマット -------
  targets: kindle # pdf / print_pdf / epub / kindleから選択可
  # targets: pdf                          # 閲覧用PDFを指定
  # targets: pdf, print_pdf               # 閲覧用PDF, 印刷所入稿用PDFを指定
  # targets: pdf, print_pdf, epub         # 閲覧用PDF, 印刷所入稿用PDF, 電子書籍EPUBを指定
  # targets: pdf, print_pdf, epub, kindle # 閲覧用PDF, 印刷所入稿用PDF,
                                          # 電子書籍EPUB, Kindle用EPUB

  include_version: true # true:  vivlio_starter_v1.0.0.pdf
                        # false: vivlio_starter.pdf

  # ------- PDF プレビュー設定（macOS のみ） -------
  pdf_preview:
    close_existing_windows: true # 既存PDFウィンドウを閉じる
    window_bounds: "{4096, 0, 5120, 2160}"    # PDF表示位置とサイズ（5Kモニターの右側1/5）
    # window_bounds: "{0, 0, 1024, 768}"      # 左上角に小さなウィンドウ
    # window_bounds: "{1920, 0, 1920, 1080}"  # モニター全画面（フルHD）

  # ------- 表紙・裏表紙設定 -------
  cover: master  # covers/内の著者用意画像(frontcover_master.png, backcover_master.png)を指定
  # cover: light # 標準添付 light 表紙・裏表紙を指定
  # cover: dark  # 標準添付 light 表紙・裏表紙を指定

  # ------- PDF設定（閲覧用） -------
  pdf:
    combined: true  # true で front/backcover を結合、false で除外
    compress: false # 自動圧縮を有効にするか（処理時間が増加）
                    # vs build --compress / --no-compress で上書き可能
    techbook: true  # 技術書典向け Techbook モード（既定は有効）
                    # カラー絵文字を Twemoji 画像へ差し替え、
                    # 入稿できない Type 3 フォント化を防ぎます
                    # 画像を使うのでクレジット表記が要ります（legal.twemoji）

  # ------- 印刷所 入稿用PDF設定 -------
  print_pdf:
    bleed: 3mm # 塗り足し幅
    crop_marks: true # トンボを付ける
    full_bleed: false # 本文に紙の端まで届く画像・背景があるなら true
                      # false のまま入稿すると白フチ事故になります
                      # （false は閲覧用 PDF から導出するぶん速い代わりに、
                      #   裁たれた塗り足しを復元できません）
    # 以下は任意
    # cover_bleed: scale # 持ち込み表紙の塗り足し。既定は scale（＝拡大して流用）
    #                    # keep にすると拡大しない（塗り足し帯は白のまま）
    #                    # covers/frontcover_master_bleed.png があればそちらが優先されます
    # icc_profile: /path/to/JapanColor2001Coated.icc # CMYK 変換用
    #                    # 未指定なら press-ready 同梱の Japan Color 2001 Coated

  # ------- EPUB設定（楽天Kobo / Apple Books 向けクリーン EPUB） -------
  epub:
    embed: true # 表紙画像を EPUB に埋め込むか（楽天/Apple向けは true 推奨）
    layout: reflowable # reflowable（リフロー型）。fixed（固定レイアウト型）は将来対応
    # メタデータ（title, author, language, isbn, publisher）は book セクションから自動的に流用される

  # ------- Kindle設定（Amazon Kindle 向け・KPF へ自動変換） -------
  kindle:
    embed: false # 表紙画像を EPUB に埋め込むか（Kindle は二重表紙を避けるため false 推奨）
    layout: reflowable # reflowable（リフロー型）。fixed（固定レイアウト型）は将来対応
    # メタデータは book セクションから自動流用。KPF 変換は kindlepreviewer を使用。

# ======= 原稿の検証（vs build と vs preflight に共通） =======
# CLI の --no-verify（全部止める）／--verify-links（外部 URL を調べる）で
# その場かぎりの上書きができます。ここに書くのは本ごとの既定値です。
verify:
  images: true # 画像パスの存在チェック
  bare_urls: true # 裸 URL の検出と警告
  external_links: false # 外部 URL の HTTP 到達性チェック（毎回調べるなら true）

  # 以下は external_links: true のときだけ効きます
  timeout: 10 # HTTP チェックのタイムアウト秒数
  max_concurrency: 5 # HTTP チェックの最大同時接続数

# ======= リーガル（免責・商標など） =======
legal:
  disclaimer: | # 免責事項
    本書は教育目的で作成された入門書であり、情報の提供のみを目的としています。内容の正確性には万全を期しておりますが、技術的な詳細については、専門的な文献もあわせてご参照ください。
    本書の内容を参考にした結果生じた損害や、本書の内容を実行・運用・適用したことによって発生した問題について、著者・発行者および関係者は一切の責任を負いかねます。
  trademark: | # 商標に関する事項
    本書に登場するシステム名や製品名は、関係各社の商標または登録商標です。
    本書では ™、®、© などのマークは省略しています。
  twemoji: | # 絵文字クレジット（Twemoji）
    本書で使用している絵文字画像は Twemoji (https://twemoji.twitter.com) を利用しています。
    Copyright © Twitter, Inc and other contributors. Licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).


#  ── ここから下は機能ごとの詳細設定 ────────────


# ======= 索引・用語集共通設定 =======
index_glossary:
  enabled: true # true … 索引・用語集機能を共に有効にする
                # false … 索引・用語集機能を共に無効にする

  use_mecab: true # MeCab による読み自動推測を使用

  timezone: "Asia/Tokyo" # タイムゾーン (レビュー時の新着判定に利用)

  context_width: 40 # 文脈抽出の幅（キーワード前後の文字数）
                    # 小さな画面なら 20文字、大画面なら 60文字 など調整可能

  # 索引ライブラリ（用語集[g]・reject を書籍間で持ち運ぶ）は設定不要です。
  #   vs index:export [パス] … 書き出す（省略時 index_library.yml）
  #   vs index:import [パス] … 取り込む（別の本のライブラリは パスを指定）

# ======= 索引設定 =======
index:
  auto_discovery: true # true … 手動登録以外の語句を自動的に探索・提案する。
                       # false … 手動で指定した語句の抽出と読み推測のみ行う。

  title: "索引" # 索引ページのタイトル

  target_terms: light # 索引語数の目安
                      #   light    … 控えめ（主要な語だけを拾う）
                      #   standard … 標準（既定）
                      #   thorough … 丁寧（初学者向けに広く拾う）
                      #   260      … 語数を直接指定することもできます
                      # 目安は本文の文字数から算出されます。vs index:plan で確認できます。

  candidate_pool: 3.0 # 目安語数の何倍までを候補として提示するか

  auto_approve: false # true … 推奨候補を自動で辞書へ登録する。
                      # false（既定）… レビューファイルで著者が選ぶ。

  common_term_ratio: 0.5 # この比率以上の章に出る語は「一般語」として索引から外すことを推奨する

  reference_style: main_and_sub # 参照の出し方
                                # main_and_sub … 主要参照を太字で先頭に置き、
                                #                 副次参照を続ける（既定）
                                # main_only    … 主要参照のみ記載する
                                # all          … 太字も間引きもしない
                                # 主要参照は _index_glossary_review.md の
                                # 「- 主要参照: 11, 12」のように章番号で指定します。

  max_sub_references: 8 # main_and_sub のときに残す副次参照の件数（0 で無制限）

  page_range_min: 3 # 索引のページ番号を範囲表記（12-15）にまとめる最小の連続数
                    # 2 だと「12, 13」のほうが読みやすいので、既定は 3

# ======= 用語集設定 =======
glossary:
  title: "用語集" # 用語集ページのタイトル

  require_definition: false # 説明文を必須にするか
                            # true の場合、[g] フラグで説明文がないとエラー

  max_definition_length: 500 # 説明文の最大文字数（超過した場合は警告）
                             # Markdown 装飾を除去した文字数で判定

# ======= 文章品質メトリクスの基準値 =======
metrics:
  # ------- 章・節の分量基準 -------
  # 「本文」＝コードと記法を除いた地の文の文字数を数えます。
  # 本全体の本文字数を目安にプリセットを選択して下さい。
  # （ページ数は判型・余白・書体・図版の量で大きく変わるため、参考として併記しています）

  # プリセットを選択
  # use: compact  # 〜3.5 万字   (20〜50 ページ)
  # use: handy    # 3.5〜6.5 万字 (50〜100 ページ)
  use: standard  # 6.5〜9 万字  (100〜200 ページ)
  # use: commercial # 9〜15 万字  (200〜350 ページ)
  # use: heavy     # 15 万字〜    (350 ページ以上)
  # use: author_custom

  # use: relative
  #   絶対の目安ではなく「その本自身の章の中央値」と比べたい場合に選びます。
  #   自分の本の中で目立って短い章・長い章だけを知らせる、という見方に切り替えます。
  #     中央値の 0.65 倍未満 → 💡 加筆検討 ／ 0.80〜1.20 倍 → ✅ ／ 1.50 倍超 → 💡 やや長い
  #   章が 5 つに満たない本では総本文字数に基づくプリセットが適用されます。

  compact: # 薄い本（〜3.5 万字／20〜50 ページ）
    chapter:
      min: 800            # 加筆検討ライン。これ未満だと 💡 加筆検討
      ideal: [1100, 3400] # 理想的な範囲 [下限, 上限]。この中に収まると ✅
      max: 4200           # やや長いライン。これを超えると 💡 やや長い
    section: { min: 400, ideal: [1000, 2800], max: 4000 } # 1 行に纏めても同じ意味

  handy: # 手に取りやすい技術書（3.5〜6.5 万字／50〜100 ページ）
    chapter: { min: 2900, ideal: [3400, 5700], max: 6800 }
    section: { min: 400, ideal: [1000, 2800], max: 4000 }

  standard: # 標準的な同人誌・技術書（6.5〜9 万字／100〜200 ページ）
    chapter: { min: 4200, ideal: [4800, 8500], max: 9700 }
    section: { min: 400, ideal: [1000, 2800], max: 4000 }

  commercial: # 商業出版レベル（9〜15 万字／200〜350 ページ）
    chapter: { min: 6400, ideal: [7800, 14600], max: 17800 }
    section: { min: 400, ideal: [1000, 2800], max: 4000 }

  heavy: # 大部の本（15 万字以上／350 ページ以上）
    chapter: { min: 9200, ideal: [11000, 16000], max: 19600 }
    section: { min: 400, ideal: [1000, 2800], max: 4000 }

  author_custom: # 自作プリセット（既定は commercial と同じ。自由に書き換えてください）
    chapter: { min: 6400, ideal: [7800, 14600], max: 17800 }
    section: { min: 400, ideal: [1000, 2800], max: 4000 }

  exclude_chapters: [00, 90-98, 99] # 分量喚起から除外する章（前書00、付録90-98、後書99を除く）

  # ------- 語彙難度の基準 -------
  # 分量とは向きが逆で、min 未満は「平易すぎる」・max 超過は「硬すぎる」の合図です。
  # 書き方は上のプリセットと同じ（min / ideal[下限, 上限] / max）。

  kanji_ratio: { min: 20, ideal: [25, 35], max: 45 } # 漢字比率（%）

  word_length: { min: 1.5, ideal: [2.0, 2.5], max: 3.0 } # 平均語長（文字数、MeCab 分かち書き後）
                                                         # max 超過は専門用語が多すぎる可能性

  # ------- 読みやすさの基準 -------
  # 建石由佳・小野芳彦・山田尚勇 (1988)「日本文の読みやすさの評価式」に基づき算出しています。
  #   60 以上 → Easy（小中学生向け）／ 40〜60 → Standard（一般ビジネス・実用書）
  #   40 未満 → Professional（専門家・技術者向け）… この章に 🤔 やや難解 が付きます
  # 技術書で 🤔 が頻発するなら standard を下げてください（例: 35）。
  readability: { standard: 40, easy: 60 }

  # ------- 案内メッセージの調整 -------

  labels: # 章別リストに添える文言
    # 分量について
    too_short: "加筆検討" # プリセットの min 未満
    just_right: "丁度良い" # プリセットの ideal に収まっている
    too_long: "やや長い" # プリセットの max 超過
    # 文章の質について
    monotonous: "表現が単調"
    too_complex: "やや難解"

# ======= 文章校正（vs lint）設定 =======
lint:
  disabled_rules: # 無効化したい textlint ルール ID（集約表示で [ ] に出る名前）を、指定することにより、
                  # 該当ルールを無効化できます。
    - arabic-kanji-numbers # 「一つ→1つ」を無効化する。

  # ルールではなく、個別の語句を指定して指摘を抑制したい場合には
  # config/textlint_allowlist.yml に追記してください。
  # （例:「以下の => 次の」を抑制するなら「以下の」を記述する）。全ルールの対象から外れます。

  sentence_length_max: 100 # 一文の最大文字数（sentence-length）。未指定なら既定 100
                           # 好みに応じて 80 / 120 など。0 を書くと長さを検査しません

  trim_long_vowel: true # 技術者向けに「サーバ／パラメータ／フィルタ」等の
                        # 末尾長音を省く文体を選ぶ場合は true
                        # 「X => Xー」（末尾に長音を足す）系の指摘を黙らせます。

  allow_space_around_code: true # インラインコードと和文の間のスペース
                                # （例: `vs import` コマンド）を許容する場合は true
                                # 技術書で一般的な「和欧間スペース」を残したいとき
                                # textlint 設定レベルで無効化するため
                                # vs lint --fix でもスペースは削除されません。

  allow_space_between_ja_en: true # 全角と半角（英数・記号）の間のスペースを許容する場合は true。

# ======= スペルチェック（vs lint）設定値 =======
spellcheck:
  # 綴り誤りと指摘したくない語は config/spellcheck_allowlist.yml に置きます。
  # `vs lint --register` が未知語をそこへ自動追記し、辞書順に整列します。

  extra_dictionaries: # オンデマンドダウンロード辞書
    # - ada           # 標準搭載以外のプログラミング言語の綴り誤りも確認したい場合に指定

  check_code_blocks: false # false … コードブロック内を校正対象にしない（既定値）
                           # true  … コードブロック内を校正対象にする

# ======= PDF 読み取り（vs pdf:read）の既定値 =======
pdf_read:
  # ------- 本文として拾う範囲（版面の外側を除く） -------
  text_area:
    top_margin: 18 # 上端からの除外幅(mm)
    bottom_margin: 20 # 下端からの除外幅(mm)
    inner_margin: 15 # 綴じ側（奇数ページは左、偶数ページは右）除外幅(mm)
    outer_margin: 12 # 小口側の除外幅(mm)

  page_separator: false # true  … "---" でページ区切りを行なう
                        # false … "---" でページ区切りを行なわない

  # ------- OCR（埋め込みテキストが無いページの読み取り） -------
  ocr:
    mode: auto # OCR の実行モード
               #   auto    … スキャンページを自動検出して必要な箇所のみ OCR
               #   force   … 全ページを必ず OCR（埋め込みテキストを無視）
               #   disable … OCR を無効化（埋め込みテキストのみ使用）

    languages: # 読み取る言語。縦書きが多い本は japanese_vertical も並べます
      - japanese

    dpi: 300 # OCR 前に生成する画像の解像度
             # 上げると精度は向上するが処理時間も増加

    psm: 3 # Tesseract の PSM (Page Segmentation Mode)
           # 章扉などの大見出しには 6、縦書き主体なら 5/7 が目安

    inline_image_text: include # イラスト内テキストの扱い
                               #   include    … 本文にそのまま含める
                               #   exclude    … 画像キャプションのみ残し本文から除外
                               #   captionize … キャプション化して本文のノイズを減らす
