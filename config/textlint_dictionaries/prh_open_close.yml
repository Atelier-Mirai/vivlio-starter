meta:
  - title: 漢字の閉じ開きルール
  - memo: 手動更新で管理してます
rules:
  - expected: $1あとで
    pattern: /(して|した|、)後で/
    specs:
      - from: して後で
        to: してあとで
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 予め
    expected: あらかじめ
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: ある
    patterns:
      - 有る
      - 在る
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: あるいは
    pattern: 或いは
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: いくつか
    pattern: 幾つか
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: いずれ
    pattern: 何れ
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 何時か
    expected: いつか
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: いったん
    pattern: 一旦
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 未だに
    expected: いまだに
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 所謂
    expected: いわゆる
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: うまく
    pattern: 巧く
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 面白い
    expected: おもしろい
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: および
    pattern: 及び
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: かかわらず
    pattern: /関わ?らず/
    specs:
      - from: 関わらず
        to: かかわらず
      - from: 関らず
        to: かかわらず
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 下さい
    expected: ください
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: さまざま
    pattern: 様々
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: さらに
    pattern: /(変)?更に/
    regexpMustEmpty: $1
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
    specs:
      - from: 変更に
        to: 変更に
  - pattern: 次第に
    expected: しだいに
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: したがって
    pattern: /(?<!に)従って/
    specs:
      - from: 従って、次の手順で進めます
        to:   したがって、次の手順で進めます
      - from: 指定した向きに従って伸びます
        to:   指定した向きに従って伸びます
      - from: テンプレートに従って自動展開します
        to:   テンプレートに従って自動展開します
    prh: 接続詞の「したがって」はひらく。動詞の「〜に従って」は漢字のまま
         （公用文における漢字使用等について「したがって」＋「動詞の『従う』は漢字で書く」）
  - pattern: して頂く
    expected: していただく
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 凄い
    expected: すごい
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: すでに
    pattern: 既に
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: すべて
    pattern: /(全て|総て)/
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: そう言う
    expected: そういう
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: そんな風な
    expected: そんなふうな
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: たくさん
    pattern: 沢山
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: ただし
    pattern: 但し
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: たとえば
    pattern: 例えば
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: ちょうど
    pattern: /(丁度|調度)/
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  # 開くのは可能の「できる」だけ。完成を表す「出来上がる」は「出来栄え」と同じく漢字で書く
  - expected: でき$1
    pattern: /出来(る|て|た|ま)/
    specs:
      - from: 出来ました
        to: できました
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: どういうとき
    pattern: どういう時
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 時々
    expected: ときどき
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 特に
    expected: とくに
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 何処か
    expected: どこか
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 無い
    expected: ない
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: なぜ
    pattern: 何故
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: なる
    pattern: 成る
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 捗る
    expected: はかどる
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: はじめて
    pattern: 初めて
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: はやる
    pattern: 流行る
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: ほとんど
    pattern: 殆ど
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 真面目に
    expected: まじめに
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: まったく
    pattern: 全く
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 無駄
    expected: ムダ
    prh: カタカナで書くと読みやすくなります（ひらく漢字）
  - expected: もっとも
    pattern: 最も
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: もっぱら
    pattern: 専ら
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: もら$1
    pattern: /貰(う|い)/
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
    specs:
      - from: 貰う
        to: もらう
      - from: 貰い
        to: もらい
  - pattern: 易い
    expected: やすい
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: ゆえに
    pattern: /(?<!事)故に/
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - expected: 分か$1
    patterns: /わか(る|り|ら|っ)/
    specs:
      - from: 一目でわかります
        to:   一目で分かります
      - from: 著者にしかわからない
        to:   著者にしか分からない
      - from: はっきりわかった
        to:   はっきり分かった
      - from: 意見がわかれる
        to:   意見がわかれる
      - from: わかい人にも読める
        to:   わかい人にも読める
      - from: 湯をわかす
        to:   湯をわかす
    prh: 「分かる」は実質動詞なので漢字。公用文作成の考え方（令和4年）は「解る・判る→分かる」と定め、
         仮名にするのは助詞・助動詞・補助動詞・形式名詞に限る。別語の「分かれる」と「若い・沸かす」は変えない
  - pattern: 持って来る
    expected: 持ってくる
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 育って行く
    expected: 育っていく
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）
  - pattern: 電話を掛ける
    expected: 電話をかける
    prh: ひらがなで書くと読みやすくなります（ひらく漢字）

  # --- ひらく漢字・閉じる漢字と送り仮名 ---
  - expected: $1ずつ
    patterns: /(\d+[個つ]?)づつ/
    specs:
      - from: 2個づつ
        to  : 2個ずつ
      - from: 2つづつ
        to  : 2つずつ
  - expected: 箇所
    patterns: /[ヶか]所/
    specs:
      - from: 一ヶ所
        to  : 一箇所
      - from: 2か所
        to  : 2箇所
  - expected: $1個
    patterns: /([0-9]+)コ/i
    prh: "https://github.com/asciidwango/js-primer/issues/979"
  - expected: 呼び出す
    patterns: 呼びだす
  - expected: 見てい$1
    patterns: /見て行(く|き)/
    specs:
      - from: では、実際にどのように書くかの例を見て行きたいと思います。
        to:   では、実際にどのように書くかの例を見ていきたいと思います。
  - expected: どのような
    patterns: /どういう(?!こと)/
    specs:
      - from: どういうものがthenableなのか
        to:   どのようなものがthenableなのか
  - expected: $1とき
    pattern:  /(の)時(?!点|代|々|間|刻|期)/
  - expected: 明らか
    patterns: あきらか
  - expected: 疑似
    patterns: 擬似
  - expected: ループごと
    patterns: ループ毎
    prh: 毎 -> ごと
  - expected: $1際
    patterns: /(する)さい/
    prh: さい -> 際
  - expected: 先程
    patterns:
      - さきほど
      - 先ほど
  - expected: 何
    patterns: なに
  - expected: はじめに
    patterns: /(始|初)めに(?!くい)/
    specs:
      - from: 始めに用語を決めます
        to:   はじめに用語を決めます
      - from: 書き始めにくい語
        to:   書き始めにくい語
    prh: 副詞の「はじめに」はひらく。動詞の「始める」は漢字のまま
  - expected: $1人
    patterns: /(する)ひと/
  - expected: $1方
    patterns: /(する)かた/
    prh: かたと読む場合は方にする
  - expected: 元々
    patterns: もともと
    prh: もと -> 元に統一。基づくは例外
  - expected: 基づく
    patterns: もとづく
  - expected: やり取り
    patterns: やりとり
  - expected: リンゴ
    patterns: りんご
  - expected: あるわけ
    patterns: ある訳
    prh: 〜する訳 -> 〜するわけ
  - expected: あてはめる
    patterns: 当てはめる
  - expected: あふれる
    patterns: 溢れる
  - expected: 表す
    patterns: あらわす
  - expected: 入れる
    patterns: いれる
  - expected: 受け取り
    patterns: 受けとり
  - expected: 行う
    patterns: おこなう
  - expected: 終わる
    patterns: おわる
    prh: おわりに -> 終わりに
  - expected: 関わる
    patterns: かかわる
  - expected: 気づく
    patterns: 気付く
  - expected: 異なる
    patterns: ことなる
  - expected: 過ぎる
    prh: 「〜にすぎない」はひらがな、「〜過ぎる」などは漢字にします。
    patterns: すぎる
  - expected: すぎない
    prh: 「〜にすぎない」はひらがな、「〜過ぎる」などは漢字にします。
    patterns: 過ぎない
  - expected: たどる
    patterns: 辿る
  - expected: つなぐ
    patterns: 繋ぐ
  - expected: 取り出す
    patterns: 取りだす
    prh: だす -> 出す
  - expected: 入る
    patterns: はいる
  - expected: 開く
    patterns: ひらく
  - expected: 待つこと
    patterns: まつこと
    prh: まつ -> 待つ
  - expected: 呼びます
    patterns: よびます
    prh: よぶ -> 呼ぶ
  - expected: 分ける
    patterns: わける
  - expected: 渡す
    patterns: わたす
  - expected: うま$
    patterns: /上手(く|い)/
  - expected: うれしい
    patterns: 嬉しい
  - expected: すばらしい
    patterns: 素晴らしい
  - expected: 難しい
    patterns: むずかしい
  - expected: 改めて
    patterns: あらためて
  - expected: 必ず
    patterns: かならず
  - expected: 再び
    patterns: ふたたび
  - expected: という
    patterns: と言う
  - expected: よい
    pattern:  /良い(?!例)/
    prh: 良し悪しを評価する表現は"良い"、しなくていい、など評価でない表現は"よい"を使います
    specs:
      - from: 良い
        to:   よい
      - from: 良い例
        to:   良い例
  - expected: $1とおり
    pattern:  /(の|た)通り/
    specs:
      - from: 各行の意味は次の通りです
        to:   各行の意味は次のとおりです
      - from: 予想通りの結果
        to:   予想通りの結果
      - from: 中央大通りを東へ
        to:   中央大通りを東へ
      - from: 書き方は二通りあります
        to:   書き方は二通りあります
    prh: 形式名詞の「とおり」はひらく（次のとおり）。名詞に直接付くもの（予想通り・大通り）と数詞（二通り）はそのまま
  - expected: $1中
    pattern:  /(その)なか/
    prh: ひらがなで書かず、漢字で書くと読みやすくなります
  - expected: きれい
    pattern:  綺麗
    prh: 漢字で書かず、ひらがなで書くと読みやすくなります
  - expected: $1ように
    pattern:  /(の)様に/
    prh: 漢字で書かず、ひらがなで書くと読みやすくなります
  - expected: 次$1
    pattern:  /(?:下記|以下)(の|に)/
    specs:
      - from: 以下の
        to:   次の
      - from: 以下に
        to:   次に
      - from: 次回
        to:   次回
      - from: 下記の
        to:   次の
    prh: 書籍の場合は、以下ではなく次を利用します（常に下にあるとは限らないため）
  - expected: お勧め
    patterns:
      - おすすめ
      - オススメ
    prh: ひらがなで書かず、漢字で書くと読みやすくなります
  - expected: うるう年
    patterns: 閏年
