# =============================================================
#  🔍 OCR 誤認識の補正表 - Vivlio Starter
# -------------------------------------------------------------
#  vs pdf:read が紙面を読み取った直後に、ここの表で置き換えます。
#  対象は OCR したページのテキストだけで、著者が自分で書いた原稿には触れません。
#
#  書き方は config/textlint_rewrite.yml と同じです。
#    expected … 正しい表記
#    patterns … 誤って読まれた表記（`/…/` で囲むと正規表現）
#
#  読み取った本ごとに癖が違うので、気づいたものを足していってください。
# =============================================================

version: 1
rules:
  # --- 字形の似た漢字 ---
  - expected: 人工知能
    patterns:
      - 入工知能 # 人 → 入

  - expected: 語彙
    patterns:
      - /語芸(?!術)/ # 彙 → 芸。「言語芸術」に当たらないよう、直後の「術」を外す

  # --- カタカナの濁点・半濁点 ---
  - expected: ウェブ
    patterns:
      - ウェプ # ブ → プ

  - expected: テキスト
    patterns:
      - テチキスト # キ → チキ（画数の多い字が割れる）

  # --- 先頭の字が落ちる ---
  - expected: プログラミング
    patterns:
      - /(?<![ァ-ヶー])ログラミング/ # プ が落ちる。「アナログ」等に続く形は除く

# -------------------------------------------------------------
#  ここから下に追記してください
# -------------------------------------------------------------
#
#  【一字だけの置き換えは書かないでください】
#  OCR がよく取り違えるのは ロ/口、力/カ、一/ー/―、二/ニ、ハ/八、大/犬、千/干 の
#  ような字形の近い一字です。しかしこれを表に書くと、正しく読めている箇所まで
#  巻き添えにします（`力 => カ` と書けば「力学」が「カ学」になります）。
#  必ず**語の形**で書いてください。
#
#      - expected: 協力
#        patterns:
#          - 協カ        # ← 「力」が「カ」と読まれた形を、語ごと直す
#
#  【Al と AI は入れていません】
#  OCR は AI を Al（エルの小文字）と読み違えますが、`Al` はアルミニウムの
#  元素記号でもあり、人名（Al Gore）でもあります。どちらが正しいかは
#  文脈でしか決まらないので、機械に任せず読み直してください。
#  AI を扱う本で、アルミニウムも人名も出てこないと分かっているなら、
#  次の 3 行を有効にしてください。
#
#      - expected: AI
#        patterns:
#          - /\bAl\b/
