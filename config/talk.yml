# ========================================
# 会話文 :::{.talk} の設定
# ========================================
# 会話文を使わないなら、このファイルは削除して構いません。
# 書き方は「拡張記法リファレンス」の章を参照してください。
#
#   :::{.talk}
#   haruka: Vivliostyle は CSS で組版するエンジンです。
#   mirai: CSS だけで本が作れるんですか？
#   :::

# ----------------------------------------
# 表示設定（本全体の既定。:::{.talk style=inline} のようにブロックごとにも変えられます）
# ----------------------------------------
display:
  style: chat         # chat（吹き出し）/ inline（「名前：発話」の 1 段落）
  name: true          # 話者名を表示する
  avatar: on          # on（画像を指定した話者だけ）/ auto（画像が無ければ簡易アバター）/ off
  separator: "："     # inline のときの、名前と発話の区切り
  avatar_size: 12     # アバターの直径（mm）。話者ごとの avatar_size が優先

# ----------------------------------------
# 話者（キーは半角英数で、本文の「キー: 発話」に使います。display は使えません）
# ----------------------------------------
#   name         表示名（省略時はキー）
#   color        theme.color と同じ色名、または #4f46e5 のような HEX（省略時はテーマの色）
#   avatar       images/characters/ の画像ファイル名、または auto（名前の頭の字の簡易アバター）
#   avatar_size  この話者のアバターの直径（mm）。似顔絵なら 15 前後
#   initial      簡易アバターに入れる 1〜2 文字（省略時は表示名の頭 1 文字）
#   side         left / right（省略時は出現順に左右交互）
#
# 色だけなら「mirai: blue」とも書けます（表示名はキーのまま）。
# 下の 2 人は記入例です。あなたの話者に書き換えてください。

haruka:
  name: 遙香
  color: red
  avatar: haruka.webp
  avatar_size: 15mm
  side: left

mirai:
  name: 未來
  color: blue
  avatar: mirai.webp
  avatar_size: 15mm
  side: right

# 95 章（アインシュタインの物語）で使う話者
einstein:
  name: アインシュタイン
  color: navy
  avatar: auto
  initial: AE
  side: left

bohr:
  name: ボーア
  color: teal
  avatar: auto
  initial: NB
  side: right
